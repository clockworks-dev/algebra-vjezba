<!doctype html>
<html lang="hr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Žute Pokemon vrste</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="styles/style.css" />
        <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
        <script src="main.js" defer></script>
    </head>
    <body>
        <main class="container">
            <h1>Žute Pokemon vrste</h1>
            <p id="status" role="status">Učitavanje podataka...</p>

            <div class="table-responsive">
                <table class="table table-warning table-striped table-hover align-middle pokemon-table">
                    <thead>
                    <tr>
                        <th class="d-none d-md-table-cell" scope="col">Redni broj</th>
                        <th scope="col">Pokemon vrsta</th>
                    </tr>
                    </thead>
                    <tbody id="pokemon-results"></tbody>
                </table>
            </div>
        </main>

        <script id="pokemon-template" type="text/x-handlebars-template">
            {{#each pokemon}}
                <tr>
                    <td class="d-none d-md-table-cell">{{number}}</td>
                    <td>
                        <a class="d-none d-md-inline" href="{{url}}" target="_blank" rel="noopener noreferrer">{{name}}</a>
                        <div
                            class="pokemon-name d-md-none"
                            role="button"
                            tabindex="0"
                            data-bs-toggle="popover"
                            data-bs-trigger="click"
                            data-bs-placement="auto"
                            data-bs-html="true"
                            data-bs-title="{{name}}"
                            data-bs-content="&lt;a href='{{url}}' target='_blank' rel='noopener noreferrer'&gt;Više informacija o vrsti&lt;/a&gt;"
                        >{{name}}</div>
                    </td>
                </tr>
            {{/each}}
        </script>
    </body>
</html>
